<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Rodrigo</title>

  <!-- Fontes personalizadas do Google -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styleContato.css">



</head>

<body>

  <header>
    <h1>Entre em Contato</h1>
    <p style="color: #0f4e5e;">Conecte-se pelas redes ou envie uma mensagem direto pelo <e-mail></e-mail>.</p>
  </header>

  <div class="redes">
    <a class="f" href="https://facebook.com/" target="_blank">Facebook</a>
    <a class="i" href="https://instagram.com/" target="_blank">Instagram</a>
    <a class="l" href="https://www.linkedin.com/in/rodrigo-simplicio-s-215436324?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3BmX%2B%2BtWfLQuSGgzd5BahGlQ%3D%3D" target="_blank">Linkedin</a>
    <a class="g" href="https://github.com/RidrigoSimplicioS" target="_blank">GitHub</a>
  </div>

  <div class="formulario">
    <form >
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome completo">

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>

      <button type="submit">Enviar</button>
    </form>
  </div>

  <footer>
    &copy; 2025 Rodrigo. Todos os direitos reservados.

  </footer>


</body>
</html>
